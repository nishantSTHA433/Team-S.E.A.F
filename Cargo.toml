[package]
name = "lcars-desktop"
version = "0.1.0"
edition = "2021"
description = "Touch-oriented Fedora LCARS console prototype"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.test]
debug = 0
